<div id="w"><canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"><h1>КАК ВЫЖИТЬ ВО ВРЕМЯ ЯДЕРНОГО АПОКАЛИПСИСА</h1><p>Включите звук. Длительность — 88 секунд.</p><button id="b">▶ ЗАПУСТИТЬ</button></div></div>
<script>
const cv=document.getElementById('c'),c=cv.getContext('2d'),W=1080,H=1920,TAU=Math.PI*2;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const lerp=(a,b,k)=>a+(b-a)*Math.max(0,Math.min(1,k));
let G=0;
function grad(y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,y0,W,y1-y0)}
function glow(x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a;c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.globalAlpha=1}
function person(x,y,s,o={}){
  const{walk=0,sit=false,jacket='#c8782a',arm=0}=o;
  c.save();c.translate(x,y);c.scale(s,s);
  if(sit){
    c.fillStyle='#15171b';c.fillRect(-20,-36,150,36);c.fillRect(100,-90,36,90);
    c.fillStyle=jacket;c.fillRect(-50,-200,76,170);
    c.save();c.translate(10,-185);c.rotate(arm);c.fillRect(-10,0,20,110);c.restore();
    c.fillStyle='#b9906f';c.beginPath();c.arc(-12,-235,32,0,TAU);c.fill();
    c.fillStyle='#1d1d1f';c.beginPath();c.arc(-12,-240,34,Math.PI,TAU);c.fill();
  }else{
    const b=Math.sin(walk)*14;
    c.fillStyle='#15171b';c.fillRect(-28+b,-130,24,130);c.fillRect(4-b,-130,24,130);
    c.fillStyle=jacket;c.fillRect(-38,-295,76,170);
    c.save();c.translate(0,-280);c.rotate(arm+(walk?Math.sin(walk)*.6:0));c.fillRect(-10,0,20,115);c.restore();
    c.fillStyle='#b9906f';c.beginPath();c.arc(0,-330,31,0,TAU);c.fill();
    c.fillStyle='#1d1d1f';c.beginPath();c.arc(0,-335,34,Math.PI,TAU);c.fill();
  }
  c.restore();
}
function txt(s,y,size,col,a){
  c.save();c.globalAlpha=a;c.textAlign='center';
  c.font=`900 ${size}px "Arial Black",Impact,Arial,sans-serif`;
  const words=s.split(' ');let lines=[],l='';
  for(const w of words){const t=l?l+' '+w:w;if(c.measureText(t).width>900&&l){lines.push(l);l=w}else l=t}
  lines.push(l);
  c.shadowColor='#000';c.shadowBlur=24;c.lineWidth=9;c.strokeStyle='rgba(0,0,0,.85)';c.fillStyle=col;
  lines.forEach((ln,i)=>{const yy=y+i*size*1.18;c.strokeText(ln,W/2,yy);c.fillText(ln,W/2,yy)});
  c.restore();
}
/* ---------- СЦЕНЫ ---------- */
function s1(t,p){
  grad(0,H,'#0b1220','#3a2a2a');glow(540,1000,900,'#ff9a4a',.15+.2*p);
  for(let i=0;i<12;i++){
    const w=110+hash(i)*60,h=500+hash(i+9)*700,x=i*95-20;
    c.fillStyle=`rgb(${14+i%3*4},18,26)`;c.fillRect(x,1250-h,w,h);
    for(let k=0;k<h/70;k++)for(let m=0;m<w/40;m++)if(hash(i*100+k*10+m)>.6){
      c.fillStyle=hash(i+k+m+Math.floor(t*2))>.97?'#444':'#d9a65a';c.globalAlpha=.55;c.fillRect(x+10+m*36,1250-h+20+k*70,16,26);c.globalAlpha=1}
  }
  c.fillStyle='#15161a';c.fillRect(0,1250,W,670);
  for(let i=0;i<3;i++){const x=((i*420+t*170)%1400)-200,y=1450+i*110;
    c.fillStyle='#0b0c0f';c.fillRect(x,y,190,60);c.fillRect(x+30,y-34,120,40);glow(x+190,y+28,90,'#ffe9b0',.6)}
  for(let i=0;i<5;i++){const d=i%2?1:-1,x=(((i*280+t*50*d)%1300)+1300)%1300-100;
    person(x,1340+i*8,.55,{walk:t*6+i,jacket:['#5b6168','#7a3b2e','#c8782a','#3c5a6a','#6b6b4a'][i]})}
  if(p>.5){G=(p-.5)*2;c.fillStyle='rgba(200,20,20,'+(Math.sin(t*14)>0?.18:.05)+')';c.fillRect(0,0,W,H);
    c.fillStyle='rgba(150,10,10,.85)';c.fillRect(0,700,W,150);c.font='900 64px "Arial Black",Impact,Arial';c.textAlign='center';
    c.fillStyle=Math.sin(t*10)>0?'#fff':'#ffb0a0';c.fillText('ВНИМАНИЕ! ТРЕВОГА',W/2,800)}
}
function s2(t,p){
  grad(0,H,'#0a0f1a','#2b1d1a');
  const fl=.5+.5*Math.sin(t*5);glow(780,1000,800,'#ffb060',.3+.5*fl*Math.min(1,p*3));
  for(let i=0;i<6;i++){c.fillStyle='#10131a';c.fillRect(i*190-30,900-hash(i)*350,170,700)}
  c.fillStyle='#0d0f14';c.fillRect(640,450,440,860);
  for(let k=0;k<6;k++)for(let m=0;m<4;m++)if(hash(k*7+m)>.5){c.fillStyle='#6b5a3a';c.fillRect(670+m*100,490+k*110,40,50)}
  c.fillStyle='#050608';c.fillRect(800,1130,130,180);
  c.fillStyle='#15171c';c.fillRect(0,1300,W,620);
  const st=p<.25,hx=st?200:200+(p-.25)/.75*560;
  person(hx,1450,1.15,{walk:st?0:t*14,arm:st?-1.5:0});

}
function s3(t,p){
  c.fillStyle='#24272b';c.fillRect(0,0,W,H);
  c.fillStyle='#4a4036';c.fillRect(0,360,W,26);c.fillRect(0,430,W,18);c.fillRect(300,360,20,300);
  c.fillStyle='#17191c';c.fillRect(0,1300,W,620);
  for(let k=0;k<11;k++){c.fillStyle=k%2?'#32363b':'#2c3035';c.fillRect(120+k*45,760+k*48,45,1300-(760+k*48))}
  c.fillStyle='#3a3228';for(let i=0;i<3;i++)c.fillRect(780+i*70,1180-i*20,90,120+i*20);
  const sx=700+Math.sin(t*1.5)*30;c.strokeStyle='#111';c.lineWidth=4;c.beginPath();c.moveTo(700,0);c.lineTo(sx,610);c.stroke();
  c.fillStyle='#ffd58a';c.fillRect(sx-14,610,28,32);
  glow(sx,650,600,'#ffd58a',.45+.15*hash(Math.floor(t*12)));
  const hx=170+p*440,k=(hx-120)/45;person(hx,760+k*48,.95,{walk:t*8});
}
function s4(t,p){
  c.fillStyle='#202327';c.fillRect(0,0,W,H);c.fillStyle='#1b1918';c.fillRect(0,1250,W,670);
  glow(700,500,800,'#ffd58a',.25);
  const a=th=>Math.max(0,Math.min(1,(p-th)*8));
  person(230,1330,1.25,{sit:true});
  c.globalAlpha=a(.1);for(let i=0;i<4;i++){c.fillStyle='#9cc8e0';c.fillRect(480+i*55,1210,38,110);c.fillStyle='#ddd';c.fillRect(488+i*55,1195,22,16)}
  c.globalAlpha=a(.25);for(let i=0;i<3;i++){c.fillStyle='#a07a3a';c.fillRect(720+i*60,1250,50,70)}
  c.globalAlpha=a(.4);c.fillStyle='#e8e8e8';c.fillRect(480,1360,150,100);c.fillStyle='#c0261a';c.fillRect(535,1375,40,70);c.fillRect(520,1390,70,40);
  c.globalAlpha=a(.55);c.fillStyle='#555';c.fillRect(700,1390,110,34);glow(820,1407,260,'#fff3c0',.7*a(.55));
  c.globalAlpha=a(.7);c.fillStyle='#2a2a2a';c.fillRect(480,1030,150,100);c.fillStyle='#777';c.fillRect(500,1048,60,50);c.fillRect(620,1000,6,40);
  c.globalAlpha=a(.82);c.fillStyle='#111';c.fillRect(880,1400,70,120);glow(915,1460,120,'#9fd8ff',.5);
  c.globalAlpha=1;
}
function s5(t,p){
  c.fillStyle='#1c1f23';c.fillRect(0,0,W,H);c.fillStyle='#17191c';c.fillRect(0,1300,W,620);
  grad(300,720,'#6a6f73','#2a2d30');
  c.fillStyle='#1c1f23';c.fillRect(0,300,340,420);c.fillRect(740,300,340,420);c.fillRect(340,300,400,0);
  c.fillStyle='#0e0f11';for(let i=0;i<5;i++)c.fillRect(350+i*78,560-hash(i)*120,70,200);
  c.fillStyle='#b8bcc0';for(let i=0;i<40;i++){const x=350+hash(i)*380,y=(300+((hash(i+50)*420+t*40)%420));c.fillRect(x,y,3,3)}
  c.strokeStyle='#0b0c0e';c.lineWidth=16;c.strokeRect(340,300,400,420);
  person(280,1400,1.25,{sit:true});
  c.fillStyle='#2a2a2a';c.fillRect(640,1300,170,100);c.fillStyle='#444';c.beginPath();c.arc(700,1350,26,0,TAU);c.fill();
  c.strokeStyle='#888';c.lineWidth=4;c.beginPath();c.moveTo(790,1300);c.lineTo(840,1180);c.stroke();
  for(let k=0;k<3;k++){const r=(t*50+k*45)%135;c.strokeStyle='rgba(255,220,150,'+(1-r/135)*.6+')';c.lineWidth=4;c.beginPath();c.arc(700,1300,r+20,Math.PI*1.2,Math.PI*1.8);c.stroke()}
  glow(700,1350,300,'#ffb060',.3);
}
function s6(t,p){
  c.fillStyle='#202327';c.fillRect(0,0,W,H);c.fillStyle='#1b1918';c.fillRect(0,1350,W,570);
  glow(540,600,800,'#cfe3ff',.18);
  const off=p>.2;
  person(360,1450,1.35,{jacket:off?'#5b6168':'#c8782a',arm:p>.55?-1.2:0});
  c.fillStyle='#222';c.fillRect(740,1330,160,130);c.fillStyle='#555';c.fillRect(780,1310,80,20);
  if(p>.2&&p<.5){const k=(p-.2)/.3;c.fillStyle='#c8782a';c.fillRect(lerp(330,760,k),lerp(1150,1300,k)-Math.sin(k*Math.PI)*120,90,110)}
  if(p>.5){c.fillStyle='#c8782a';c.fillRect(760,1340,90,70)}
  c.fillStyle='#777';c.fillRect(600,850,200,22);c.fillRect(690,872,16,70);
  if(p>.55)for(let i=0;i<8;i++){c.fillStyle='rgba(150,200,255,.7)';c.fillRect(694,940+((t*500+i*60)%260),6,20)}
}
function s7(t,p){
  c.fillStyle='#202327';c.fillRect(0,0,W,H);c.fillStyle='#1b1918';c.fillRect(0,1300,W,620);
  const r=lerp(10,150,p),g=lerp(16,165,p),b=lerp(32,185,p);c.fillStyle=`rgb(${r|0},${g|0},${b|0})`;c.fillRect(700,300,260,320);
  c.strokeStyle='#0b0c0e';c.lineWidth=14;c.strokeRect(700,300,260,320);
  glow(830,520,500,'#cfe3ff',.1+.4*p);glow(300,800,500,'#ffd58a',.25);
  person(260,1450,1.25,{sit:true,arm:-.4});
  c.fillStyle='#c9b98f';c.fillRect(500,1380,340,120);c.strokeStyle='#7a6a45';c.lineWidth=3;
  for(let i=1;i<5;i++){c.beginPath();c.moveTo(500+i*68,1380);c.lineTo(500+i*68,1500);c.stroke()}
  c.beginPath();c.moveTo(520,1470);c.lineTo(640,1410);c.lineTo(800,1450);c.stroke();
  c.fillStyle='#111';c.fillRect(890,1400,80,130);c.fillStyle=Math.sin(t*4)>0?'#c0261a':'#601510';c.fillRect(900,1410,12,20);
}
function s8(t,p){
  c.fillStyle='#24272b';c.fillRect(-400,-400,W+800,H+800);c.fillStyle='#17191c';c.fillRect(-400,1300,W+800,800);
  glow(850,700,800,'#ffd58a',.4+.2*p);
  c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.ellipse(300,1050,90,270,0,0,TAU);c.fill();
  c.fillStyle='#4a4036';c.fillRect(-400,360,W+800,24);
  c.fillStyle='#ffd58a';c.fillRect(836,690,28,32);c.strokeStyle='#111';c.lineWidth=4;c.beginPath();c.moveTo(850,0);c.lineTo(850,690);c.stroke();
  person(540,1420,1.1,{sit:true});
}
const S=[
 {d:10,draw:s1,zoom:p=>1+.1*p,say:'Обычное утро. Люди идут на работу. И вдруг по городу звучит сигнал тревоги. У тебя есть несколько минут.',
  text:[[1,5,'06:42. ОБЫЧНОЕ УТРО.'],[5.5,9.6,'06:43. НАЧАЛО КОНЦА.','#ff5a3c']]},
 {d:10,draw:s2,zoom:p=>1+.06*p,say:'Правило первое. Найди укрытие. Ближайшее капитальное здание из бетона или кирпича. Не смотри на вспышку. Беги внутрь.',
  text:[[.8,9.5,'ПРАВИЛО № 1. НАЙДИ УКРЫТИЕ']]},
 {d:10,draw:s3,zoom:p=>1+.15*p,say:'Правило второе. Держись подальше от окон. Спустись глубже, в подвал или в центр здания. Бетон и земля защищают от радиации.',
  text:[[.8,9.5,'ПРАВИЛО № 2. ДЕРЖИСЬ ПОДАЛЬШЕ ОТ ОКОН']]},
 {d:12,draw:s4,zoom:p=>1+.08*p,say:'Правило третье. Вода, еда, аптечка. Фонарик, батарейки, радио. Заряди телефон, пока есть электричество.',
  text:[[.8,11.5,'ПРАВИЛО № 3. ВОДА, ЕДА, АПТЕЧКА']]},
 {d:12,draw:s5,zoom:p=>1+.06*p,say:'Правило четвёртое. Не выходи без необходимости. Самая опасная радиация в первые часы. Оставайся внутри и слушай официальные сообщения.',
  text:[[.8,11.5,'ПРАВИЛО № 4. НЕ ВЫХОДИ БЕЗ НЕОБХОДИМОСТИ']]},
 {d:12,draw:s6,zoom:p=>1+.05*p,say:'Правило пятое. Если был на улице, сними верхнюю одежду. Так уходит большая часть загрязнения. Убери её в пакет. Вымой лицо и руки водой с мылом.',
  text:[[.8,11.5,'ПРАВИЛО № 5. УМЕНЬШИ РИСК ЗАГРЯЗНЕНИЯ']]},
 {d:12,draw:s7,zoom:p=>1+.07*p,say:'Правило шестое. Сохраняй спокойствие. Экономь заряд, проверяй сообщения спасательных служб и следуй их указаниям.',
  text:[[.8,11.5,'ПРАВИЛО № 6. СОХРАНЯЙ СПОКОЙСТВИЕ']]},
 {d:10,draw:s8,zoom:p=>1.3-.4*p,say:'День второй. Опасность рядом, но ты жив, потому что принимал верные решения. Твоё главное оружие — правильные решения.',
  text:[[2,9.6,'ДЕНЬ 2','#f2ede0',130],[4.5,9.6,'ТВОЁ ГЛАВНОЕ ОРУЖИЕ — ПРАВИЛЬНЫЕ РЕШЕНИЯ','#ffd58a',70]]}
];
const TOTAL=S.reduce((a,s)=>a+s.d,0);
/* ---------- ЭФФЕКТЫ ---------- */
function post(t,d){
  if(G>0){for(let i=0;i<6;i++)if(Math.random()<G){const y=Math.random()*H|0,h=30+Math.random()*100|0;c.drawImage(cv,0,y,W,h,(Math.random()-.5)*70*G,y,W,h)}}
  const v=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.8)');c.fillStyle=v;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.09)';for(let i=0;i<250;i++)c.fillRect(Math.random()*W,Math.random()*H,2,2);
  c.fillStyle='rgba(0,0,0,.07)';for(let y=0;y<H;y+=6)c.fillRect(0,y,W,2);
  c.fillStyle='rgba(0,0,0,'+Math.random()*.05+')';c.fillRect(0,0,W,H);
  const f=Math.min(1,t/.6,(d-t)/.6);if(f<1){c.fillStyle='rgba(0,0,0,'+(1-f)+')';c.fillRect(0,0,W,H)}
}
/* ---------- ЗВУК ---------- */
let ac,mg,dg,ng,sg,so;
function initAudio(){
  ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);
  dg=ac.createGain();dg.gain.value=0;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;
  [55,58.3,110].forEach((f,i)=>{const o=ac.createOscillator();o.type=i<2?'sawtooth':'sine';o.frequency.value=f;o.connect(lp);o.start()});
  lp.connect(dg);dg.connect(mg);
  const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=ac.createBufferSource();n.buffer=buf;n.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.7;
  ng=ac.createGain();ng.gain.value=0;n.connect(bp);bp.connect(ng);ng.connect(mg);n.start();
  so=ac.createOscillator();so.type='sine';sg=ac.createGain();sg.gain.value=0;so.connect(sg);sg.connect(mg);so.start();
}
function audio(T){
  const ten=Math.min(1,T/70),out=T>78?Math.max(0,1-(T-78)/10):1;
  dg.gain.value=(.1+.18*ten)*out;
  so.frequency.value=600+250*Math.sin(T*1.3);sg.gain.value=T<22?.025:0;
  const radio=(T>42&&T<54)||(T>66&&T<78);
  ng.gain.value=(radio?.03+Math.random()*.05:.004+Math.random()*.01)*out;
}
function say(s){
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(s);u.lang='ru-RU';u.rate=1.03;u.pitch=.5;
  const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('ru'));
  u.voice=v.find(x=>/pavel|yuri|male|мужск/i.test(x.name))||v[0]||null;speechSynthesis.speak(u);
}
/* ---------- ЦИКЛ ---------- */
let t0=0,run=false,cur=-1;
function frame(now){
  if(!run)return;const T=(now-t0)/1000;
  if(T>=TOTAL){stop();return}
  let i=0,acc=0;while(i<S.length-1&&T>=acc+S[i].d){acc+=S[i].d;i++}
  const t=T-acc,s=S[i],p=t/s.d;
  if(i!==cur){cur=i;say(s.say)}
  c.clearRect(0,0,W,H);G=0;
  c.save();const k=s.zoom(p);c.translate(W/2,H/2);c.scale(k,k);c.translate(-W/2,-H/2);s.draw(t,p);c.restore();
  post(t,s.d);
  s.text.forEach(([a,b,str,col,size])=>{if(t>=a&&t<=b)txt(str,size>100?560:380,size||76,col||'#f2ede0',Math.min(1,(t-a)/.5,(b-t)/.5))});
  subs(s,t);
  audio(T);requestAnimationFrame(frame);
}
function subs(s,t){
  const parts=s.say.split(/(?<=[.!?])\s+/),tot=parts.reduce((a,x)=>a+x.length,0),span=s.d-1.2;
  let a=.5;
  for(const x of parts){
    const len=x.length/tot*span,b=a+len;
    if(t>=a&&t<b+.15){
      const g=c.createLinearGradient(0,1380,0,1800);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');
      c.fillStyle=g;c.fillRect(0,1380,W,420);
      txt(x,1540,46,'#fff',Math.min(1,(t-a)/.25+.2,(b+.15-t)/.25));
      break;
    }
    a=b;
  }
}
function stop(){run=false;if(window.speechSynthesis)speechSynthesis.cancel();if(ac)ac.suspend();
  const o=document.getElementById('ov');o.style.display='flex';o.querySelector('p').textContent='Конец.';document.getElementById('b').textContent='↻ ПОВТОР'}
document.getElementById('b').onclick=()=>{
  if(!ac)initAudio();else ac.resume();
  document.getElementById('ov').style.display='none';cur=-1;run=true;t0=performance.now();requestAnimationFrame(frame);
};
if(window.speechSynthesis)speechSynthesis.getVoices();
</script></body></html>
